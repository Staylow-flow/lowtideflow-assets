<!-- v2.1 -->
<style>
[data-ltf-masonry-v2] {
  --ltf-masonry-gap: clamp(10px, 1vw, 16px);
  --ltf-masonry-radius: 8px;
  --ltf-masonry-max-hw: 1.25;
  --ltf-masonry-height-scale: 0.9;
  --ltf-masonry-viewport-h: clamp(520px, 76vh, 820px);
  --ltf-col-w: 240px;
  width: 100%;
  overflow-x: clip;
  overflow-x: hidden;
  color: #e5e5e5;
}

[data-ltf-masonry-v2] .ltf-masonry-viewport.is-a {
  position: relative;
  width: 100%;
  max-width: 100%;
  height: var(--ltf-masonry-viewport-h);
  overflow: hidden;
  border-radius: var(--ltf-masonry-radius);
  background: linear-gradient(180deg, #06142e 0%, #00001c 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, #000 6%, #000 94%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 6%, #000 94%, transparent 100%);
}

[data-ltf-masonry-v2] .ltf-masonry-columns.is-a {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: var(--ltf-masonry-gap);
  height: 100%;
  width: 100%;
  padding: 0;
  margin: 0;
}

[data-ltf-masonry-v2] .ltf-masonry-column.is-a {
  flex: 1 1 0;
  min-width: 0;
  height: 100%;
  overflow: hidden;
  padding-top: var(--ltf-col-stagger, 0);
  box-sizing: border-box;
}

[data-ltf-masonry-v2] .ltf-masonry-column__track.is-a {
  display: flex;
  flex-direction: column;
  gap: var(--ltf-masonry-gap);
  will-change: transform;
  backface-visibility: hidden;
}

[data-ltf-masonry-v2] .ltf-masonry-column__track.is-a.is-ltf-scroll-up {
  animation: ltf-masonry-loop-up var(--ltf-loop-dur, 55s) linear infinite;
  animation-delay: var(--ltf-loop-delay, 0s);
}

[data-ltf-masonry-v2] .ltf-masonry-column__track.is-a.is-ltf-scroll-down {
  animation: ltf-masonry-loop-down var(--ltf-loop-dur, 55s) linear infinite;
  animation-delay: var(--ltf-loop-delay, 0s);
}

@keyframes ltf-masonry-loop-up {
  from { transform: translate3d(0, 0, 0); }
  to { transform: translate3d(0, -50%, 0); }
}

@keyframes ltf-masonry-loop-down {
  from { transform: translate3d(0, 0, 0); }
  to { transform: translate3d(0, 50%, 0); }
}

[data-ltf-masonry-v2][data-ltf-masonry-paused="1"] .ltf-masonry-column__track.is-a {
  animation-play-state: paused !important;
}

[data-ltf-masonry-v2] .ltf-masonry-tile.is-a {
  display: block;
  flex-shrink: 0;
  border-radius: var(--ltf-masonry-radius);
  overflow: hidden;
  background: linear-gradient(145deg, #263350 0%, #0a1a32 100%);
  border: 1px solid rgba(255, 255, 255, 0.07);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.22);
}

[data-ltf-masonry-v2] .ltf-masonry-tile__media.is-a {
  position: relative;
  width: 100%;
  line-height: 0;
  background: #00001c;
  max-height: calc(var(--ltf-col-w) * var(--ltf-masonry-max-hw) * var(--ltf-masonry-height-scale));
  overflow: hidden;
}

[data-ltf-masonry-v2] .ltf-masonry-tile__img.is-a,
[data-ltf-masonry-v2] .ltf-masonry-tile__video.is-a {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
  border: 0;
}

[data-ltf-masonry-v2] .ltf-masonry-tile__media.is-a.is-cap {
  aspect-ratio: 1 / calc(var(--ltf-masonry-max-hw) * var(--ltf-masonry-height-scale));
  max-height: calc(var(--ltf-col-w) * var(--ltf-masonry-max-hw) * var(--ltf-masonry-height-scale));
}

[data-ltf-masonry-v2] .ltf-masonry-tile__media.is-a.is-cap .ltf-masonry-tile__img.is-a,
[data-ltf-masonry-v2] .ltf-masonry-tile__media.is-a.is-cap .ltf-masonry-tile__video.is-a {
  height: 100%;
  object-fit: cover;
  object-position: center;
}

[data-ltf-masonry-v2] .ltf-masonry-tile__caption.is-a {
  display: none;
  padding: 8px 10px 10px;
  font-size: 12px;
  line-height: 1.35;
  color: #e5e5e5;
  background: linear-gradient(to top, rgba(0, 0, 28, 0.92), rgba(0, 0, 28, 0.55));
  margin-top: -2em;
  position: relative;
  z-index: 1;
}

[data-ltf-masonry-v2][data-ltf-masonry-captions] .ltf-masonry-tile__caption.is-a {
  display: block;
}

[data-ltf-masonry-v2] .ltf-masonry-loop-pad.is-a {
  width: 100%;
  pointer-events: none;
  visibility: hidden;
}

[data-ltf-masonry-v2] .ltf-masonry-source.is-a {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  [data-ltf-masonry-v2] .ltf-masonry-column__track.is-a {
    animation: none !important;
    transform: none !important;
  }
  [data-ltf-masonry-v2] .ltf-masonry-viewport.is-a {
    mask-image: none;
    -webkit-mask-image: none;
  }
}

<script>
(function () {
  var root = document.querySelector("[data-ltf-masonry-v2]");
  if (!root || root.getAttribute("data-ltf-masonry-v2-init") === "1") return;
  root.setAttribute("data-ltf-masonry-v2-init", "1");

  var MAX_HW = 1.25;
  var HEIGHT_SHRINK = 0.9;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var viewport = root.querySelector(".ltf-masonry-viewport.is-a");
  var columnsEl = root.querySelector(".ltf-masonry-columns.is-a");
  var source = root.querySelector(".ltf-masonry-source.is-a");
  if (!viewport || !columnsEl) return;

  var staggerPattern = [0, 0.14, 0.06, 0.2, 0.1, 0.16, 0.08];
  var rebuildTimer = null;
  var visibilityPaused = false;
  var ioPaused = false;

  function columnCount(w) {
    if (w >= 1600) return 5;
    if (w >= 820) return 4;
    if (w >= 520) return 3;
    return 2;
  }

  function readGapPx() {
    var g = getComputedStyle(root).getPropertyValue("--ltf-masonry-gap").trim();
    if (!g) return 14;
    if (g.indexOf("px") !== -1) return parseFloat(g) || 14;
    var probe = document.createElement("div");
    probe.style.width = g;
    probe.style.position = "absolute";
    probe.style.visibility = "hidden";
    root.appendChild(probe);
    var px = probe.getBoundingClientRect().width;
    root.removeChild(probe);
    return px || 14;
  }

  function tileKey(template) {
    var img = template.querySelector("img.ltf-masonry-tile__img.is-a");
    if (img) {
      return img.getAttribute("src") || img.currentSrc || "img-unknown";
    }
    var v = template.querySelector("video.ltf-masonry-tile__video.is-a");
    if (v) {
      return "video:" + (v.getAttribute("data-src") || v.getAttribute("poster") || "video");
    }
    return "tile-" + (template.getAttribute("data-ltf-tile-key") || "x");
  }

  function splitSourceTiles(tiles) {
    var video = null;
    var images = [];
    tiles.forEach(function (t) {
      if (t.hasAttribute("data-ltf-masonry-video-tile") || t.querySelector("video")) {
        if (!video) video = t;
      } else {
        images.push(t);
      }
    });
    return { video: video, images: images };
  }

  function capMedia(media) {
    if (!media) return;
    var img = media.querySelector("img.ltf-masonry-tile__img.is-a");
    if (!img) return;
    function apply() {
      if (!img.naturalWidth) return;
      var hw = (img.naturalHeight / img.naturalWidth) * HEIGHT_SHRINK;
      if (hw > MAX_HW + 0.01) media.classList.add("is-cap");
      else media.classList.remove("is-cap");
    }
    if (img.complete) apply();
    else img.addEventListener("load", apply, { once: true });
  }

  function cloneTile(node) {
    var clone = node.cloneNode(true);
    clone.classList.add("is-ltf-clone");
    clone.setAttribute("data-ltf-tile-key", tileKey(node));
    return clone;
  }

  function collectSourceTiles() {
    if (!source) return [];
    return Array.prototype.slice.call(
      source.querySelectorAll(":scope > .ltf-masonry-tile.is-a")
    );
  }

  function shuffleIndices(n, salt) {
    var arr = [];
    var i;
    for (i = 0; i < n; i++) arr.push(i);
    var seed = ((salt + 1) * 1103515245) >>> 0;
    for (i = n - 1; i > 0; i--) {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      var j = seed % (i + 1);
      var t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  }

  function tileHeightEstimate(node, colW) {
    var img = node.querySelector("img.ltf-masonry-tile__img.is-a");
    if (img) {
      var iw = parseInt(img.getAttribute("width"), 10) || img.naturalWidth || 960;
      var ih = parseInt(img.getAttribute("height"), 10) || img.naturalHeight || 540;
      var hw = (ih / iw) * HEIGHT_SHRINK;
      if (hw > MAX_HW) hw = MAX_HW;
      return colW * hw;
    }
    var v = node.querySelector("video.ltf-masonry-tile__video.is-a");
    if (v) {
      var vw = parseInt(v.getAttribute("width"), 10) || 960;
      var vh = parseInt(v.getAttribute("height"), 10) || 540;
      return colW * (vh / vw) * HEIGHT_SHRINK;
    }
    return colW * 0.72;
  }

  function loopContentHeight(track, gap, colW) {
    var sum = 0;
    var max = 0;
    Array.prototype.forEach.call(track.children, function (child) {
      var h = child.offsetHeight;
      if (h < 4) h = tileHeightEstimate(child, colW);
      sum += h + gap;
      max = Math.max(max, h);
    });
    return { total: sum > 0 ? sum - gap : 0, maxTile: max };
  }

  function measureTrack(track, gap, colW) {
    var m = loopContentHeight(track, gap, colW);
    return Math.max(track.offsetHeight, m.total);
  }

  function buildColumnTrack(colIdx, cols, images, videoTemplate, videoColIdx, gap, colW) {
    var track = document.createElement("div");
    track.className = "ltf-masonry-column__track is-a";
    if (!reduced) {
      track.classList.add(colIdx % 2 === 0 ? "is-ltf-scroll-up" : "is-ltf-scroll-down");
    }

    var vh = viewport.clientHeight || 600;
    var videoPlaced = false;

    if (!root._ltfColSlotKeys) root._ltfColSlotKeys = [];
    root._ltfColSlotKeys[colIdx] = [];

    var order = shuffleIndices(images.length, colIdx * 17 + 1);
    var k;
    for (k = 0; k < order.length; k++) {
      var tpl = images[order[k]];
      var node = cloneTile(tpl);
      track.appendChild(node);
      capMedia(node.querySelector(".ltf-masonry-tile__media.is-a"));
      root._ltfColSlotKeys[colIdx].push(tileKey(tpl));

      if (colIdx === videoColIdx && videoTemplate && !videoPlaced && k === 2) {
        var vNode = cloneTile(videoTemplate);
        track.appendChild(vNode);
        capMedia(vNode.querySelector(".ltf-masonry-tile__media.is-a"));
        root._ltfColSlotKeys[colIdx].push(tileKey(videoTemplate));
        videoPlaced = true;
      }
    }

    var metrics = loopContentHeight(track, gap, colW);
    var minLoop = vh + metrics.maxTile + gap * 2;
    while (measureTrack(track, gap, colW) < minLoop) {
      var pad = document.createElement("div");
      pad.className = "ltf-masonry-loop-pad is-a";
      pad.setAttribute("aria-hidden", "true");
      pad.style.height = Math.max(48, minLoop - measureTrack(track, gap, colW)) + "px";
      pad.style.flexShrink = "0";
      track.appendChild(pad);
      break;
    }

    if (colIdx === videoColIdx && videoTemplate && !videoPlaced) {
      var vOnly = cloneTile(videoTemplate);
      track.appendChild(vOnly);
      capMedia(vOnly.querySelector(".ltf-masonry-tile__media.is-a"));
      videoPlaced = true;
    }

    var singleCopyH = Math.max(
      track.offsetHeight,
      loopContentHeight(track, gap, colW).total
    );
    if (singleCopyH < vh) {
      track.setAttribute("data-ltf-loop-warning", "short");
    }

    if (!reduced && track.children.length) {
      singleCopyH = Math.max(
        track.offsetHeight,
        loopContentHeight(track, gap, colW).total
      );
      if (singleCopyH >= vh) {
        var originals = Array.prototype.slice.call(track.children);
        originals.forEach(function (child) {
          track.appendChild(cloneTile(child));
        });
      } else {
        track.setAttribute("data-ltf-loop-warning", "short-no-dup");
      }
    }

    track.setAttribute("data-ltf-loop-single-h", String(Math.round(singleCopyH)));

    return track;
  }

  function buildColumnsFromTiles(tiles, cols) {
    columnsEl.innerHTML = "";
    root._ltfColSlotKeys = [];

    var parts = splitSourceTiles(tiles);
    var images = parts.images;
    var videoTemplate = parts.video;
    var videoColIdx = Math.min(1, Math.max(0, cols - 1));
    var gap = readGapPx();
    var w = viewport.clientWidth;
    var colW = cols > 0 ? (w - gap * (cols - 1)) / cols : w;
    var i;

    for (i = 0; i < cols; i++) {
      var col = document.createElement("div");
      col.className = "ltf-masonry-column is-a";
      col.setAttribute("data-ltf-masonry-col-idx", String(i));
      var vh = viewport.clientHeight || 600;
      col.style.setProperty(
        "--ltf-col-stagger",
        (staggerPattern[i % staggerPattern.length] * vh).toFixed(1) + "px"
      );

      var track = buildColumnTrack(i, cols, images, videoTemplate, videoColIdx, gap, colW);
      col.appendChild(track);
      columnsEl.appendChild(col);
    }
  }

  function usePrebuiltColumns() {
    var cols = columnsEl.querySelectorAll(":scope > .ltf-masonry-column.is-a");
    if (!cols.length) return false;
    if (source && source.querySelector(".ltf-masonry-tile.is-a")) return false;
    cols.forEach(function (col, i) {
      var track = col.querySelector(".ltf-masonry-column__track.is-a");
      if (!track) return;
      col.setAttribute("data-ltf-masonry-col-idx", String(i));
      var vh = viewport.clientHeight || 600;
      col.style.setProperty(
        "--ltf-col-stagger",
        (staggerPattern[i % staggerPattern.length] * vh).toFixed(1) + "px"
      );
      if (!reduced) {
        track.classList.remove("is-ltf-scroll-up", "is-ltf-scroll-down");
        track.classList.add(i % 2 === 0 ? "is-ltf-scroll-up" : "is-ltf-scroll-down");
      }
      track.querySelectorAll(".ltf-masonry-tile__media.is-a").forEach(capMedia);
    });
    return true;
  }

  function applyLoopTiming() {
    var gap = readGapPx();
    var colW = parseFloat(getComputedStyle(root).getPropertyValue("--ltf-col-w")) || 240;
    var tracks = columnsEl.querySelectorAll(".ltf-masonry-column__track.is-a");
    tracks.forEach(function (track, i) {
      var halfH = measureTrack(track, gap, colW) / 2;
      if (track.offsetHeight > 0) halfH = track.offsetHeight / 2;
      var pxPerSec = halfH / (48 + (i * 5) % 18);
      var dur = Math.min(70, Math.max(40, halfH / pxPerSec));
      track.style.setProperty("--ltf-loop-dur", dur.toFixed(2) + "s");
      track.style.setProperty("--ltf-loop-delay", (i * 1.7) + "s");
      track.setAttribute("data-ltf-loop-half-h", String(halfH));
    });
  }

  function updatePauseState() {
    var paused = visibilityPaused || ioPaused;
    root.setAttribute("data-ltf-masonry-paused", paused ? "1" : "0");
  }

  function rebuildLayout() {
    var w = viewport.clientWidth;
    var cols = columnCount(w);
    var gap = readGapPx();
    var colW = cols > 0 ? (w - gap * (cols - 1)) / cols : w;
    root.style.setProperty("--ltf-col-w", colW + "px");
    root.setAttribute("data-ltf-masonry-cols", String(cols));

    if (source && source.querySelector(".ltf-masonry-tile.is-a")) {
      buildColumnsFromTiles(collectSourceTiles(), cols);
    } else if (!usePrebuiltColumns()) {
      return;
    }

    applyLoopTiming();
    wireVideos();

    root.querySelectorAll(".ltf-masonry-column img.ltf-masonry-tile__img.is-a").forEach(function (img) {
      if (!img.complete) img.addEventListener("load", scheduleRebuild, { once: true });
    });
  }

  function scheduleRebuild() {
    if (rebuildTimer) window.clearTimeout(rebuildTimer);
    rebuildTimer = window.setTimeout(function () {
      rebuildTimer = null;
      rebuildLayout();
    }, 80);
  }

  function loadVideo(v) {
    if (v.getAttribute("data-ltf-video-loaded") === "1") return;
    var src = v.getAttribute("data-src");
    if (!src) return;
    v.setAttribute("data-ltf-video-loaded", "1");
    v.src = src;
    v.load();
  }

  function wireVideos() {
    var videos = root.querySelectorAll("video.ltf-masonry-tile__video.is-a[data-ltf-video-lazy]");
    videos.forEach(function (v) {
      v.muted = true;
      v.loop = true;
      v.playsInline = true;
      v.setAttribute("muted", "");
      v.setAttribute("loop", "");
      v.setAttribute("playsinline", "");
      if (v.getAttribute("data-ltf-video-io") === "1") return;
      v.setAttribute("data-ltf-video-io", "1");
      if (!("IntersectionObserver" in window)) return;
      var vio = new IntersectionObserver(
        function (entries) {
          entries.forEach(function (e) {
            var el = e.target;
            if (e.isIntersecting && root.getAttribute("data-ltf-masonry-paused") !== "1") {
              loadVideo(el);
              el.play().catch(function () {});
            } else {
              el.pause();
            }
          });
        },
        { root: viewport, threshold: 0.12 }
      );
      vio.observe(v);
    });
  }

  if ("IntersectionObserver" in window) {
    var sectionIo = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (e) {
          ioPaused = !e.isIntersecting;
          updatePauseState();
        });
      },
      { threshold: 0.05 }
    );
    sectionIo.observe(root);
  }

  document.addEventListener("visibilitychange", function () {
    visibilityPaused = document.hidden;
    updatePauseState();
  });

  if ("ResizeObserver" in window) {
    var ro = new ResizeObserver(scheduleRebuild);
    ro.observe(viewport);
  } else {
    window.addEventListener("resize", scheduleRebuild);
  }

  root.querySelectorAll(".ltf-masonry-source .ltf-masonry-tile__media.is-a").forEach(capMedia);

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(scheduleRebuild).catch(scheduleRebuild);
  } else {
    scheduleRebuild();
  }

  updatePauseState();
  root.rebuildLtfMasonryV2 = rebuildLayout;
})();

</script>
