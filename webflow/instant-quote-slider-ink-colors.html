<div class="iq-slider-control">
  <div class="iq-slider-ticks" data-tick-count="5" aria-hidden="true">
    <span class="iq-slider-track-line"></span>
    <span class="iq-slider-tick"></span>
    <span class="iq-slider-tick"></span>
    <span class="iq-slider-tick"></span>
    <span class="iq-slider-tick"></span>
    <span class="iq-slider-tick" title="5+ Full Color"></span>
  </div>
  <input
    type="range"
    class="iq-range"
    id="iq-slider-ink-colors"
    name="ink-colors"
    min="1"
    max="5"
    step="1"
    value="1"
    data-iq-step="1"
    aria-label="Ink Colors (1–4 spot, 5+ Full Color)"
    aria-valuemin="1"
    aria-valuemax="5"
    aria-valuenow="1"
    data-iq-value-target="iq-val-ink-colors"
  />
</div>
