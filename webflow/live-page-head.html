<style id="ltf-clean-slate-fx">
/* FX only — layout lives in Webflow Designer. Do not add size/pad/align here.
   Nav-specific FX/layout (hamburger morph, hide-on-scroll, nav link/button
   hover gradient, desktop 2-row collapse, mobile nav bar + panel) moved to
   the site-wide head (#ltf-site-nav-fx) so every page gets it — do not
   re-add nav rules here. */

@keyframes ltf-upsell-sweep {
  /*
    Seamless L→R loop: background-size is 300% (one full tile = 3x the
    item's width) and background-position percentages move the image by
    (container - bgSize) * pos/100 = -2x-item-width * pos/100. Animating
    all the way to 150% therefore shifts by exactly one full 3x-width tile
    (-3x-item-width), so the frame at 150% is pixel-identical to the frame
    at 0% — the loop restart is invisible instead of jump-cutting 1/3 short.
  */
  from { background-position: 150% 50%; }
  to { background-position: 0% 50%; }
}

@property --ltf-edge-angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

@keyframes ltf-edge-spin {
  to { --ltf-edge-angle: 360deg; }
}

/* Page CTAs — 2px white outline; hover swaps to gradient ring (same size) */
.ltf-hero-bottom-bar .ltf-btn-gradient-wrap,
.ltf-section-cta .ltf-btn-gradient-wrap,
.ltf-funnel-cta .ltf-btn-gradient-wrap {
  padding: 2px !important;
  border-radius: 12px;
  background: #FFFFFF !important;
  box-shadow: none !important;
}
.ltf-hero-bottom-bar .ltf-btn-gradient-wrap:hover,
.ltf-hero-bottom-bar .ltf-btn-gradient-wrap:focus-within,
.ltf-hero-bottom-bar .ltf-btn-gradient-wrap.ltf-btn-gradient-active,
.ltf-section-cta .ltf-btn-gradient-wrap:hover,
.ltf-section-cta .ltf-btn-gradient-wrap:focus-within,
.ltf-section-cta .ltf-btn-gradient-wrap.ltf-btn-gradient-active,
.ltf-funnel-cta .ltf-btn-gradient-wrap:hover,
.ltf-funnel-cta .ltf-btn-gradient-wrap:focus-within,
.ltf-funnel-cta .ltf-btn-gradient-wrap.ltf-btn-gradient-active {
  padding: 2px !important;
  background: transparent !important;
  box-shadow: none !important;
}
.ltf-hero-bottom-bar .ltf-btn-primary,

  color: #E5E5E5 !important;
}

/* ── Crew + Specs glow ─────────────────────────────────────────────── */
.ltf-card,
.ltf-spec-card {
  position: relative;
  overflow: visible !important;
  isolation: isolate;
  /* Hold border transparent until the ring finishes fading (avoids white flash on hover out). */
  transition: border-color 0.15s ease 0.35s;
}
.ltf-card::before,
.ltf-spec-card::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: inherit;
  background:
    radial-gradient(ellipse at 22% 18%, rgba(112, 64, 192, 0.72) 0%, transparent 52%),
    radial-gradient(ellipse at 82% 28%, rgba(42, 170, 184, 0.62) 0%, transparent 50%),
    radial-gradient(ellipse at 48% 92%, rgba(11, 128, 80, 0.58) 0%, transparent 55%),
    radial-gradient(ellipse at 70% 70%, rgba(31, 119, 129, 0.4) 0%, transparent 48%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.45s ease;
}
.ltf-card:hover::before,
.ltf-card.is-glow::before,
.ltf-spec-card:hover::before,
.ltf-spec-card.is-glow::before {
  opacity: 0.84;
}
.ltf-card > *,
.ltf-spec-card > * {
  position: relative;
  z-index: 1;
}
.ltf-card::after,
.ltf-spec-card::after {
  content: '';
  position: absolute;
  /* Cards have a 3px border; -3px puts this pseudo on the border box edge
     (absolute children sit from the padding edge, so 0/inherit sits inward).
     The old -6px/18px version floated the ring outside the card, exposing
     page background in the gap. border-radius: inherit matches 12px exactly. */
  inset: -3px;
  z-index: 2;
  border-radius: inherit;
  /* 3px ring thickness = Designer border width — flush replacement. */
  padding: 3px;
  background: conic-gradient(
    from var(--ltf-edge-angle),
    #4D259D, #2AAAB8, #1F7781, #0B8050, #7040C0, #4D259D
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
.ltf-card:hover,
.ltf-card.is-glow,
.ltf-spec-card:hover,
.ltf-spec-card.is-glow {
  border-color: transparent !important;
  transition: border-color 0s;
}
.ltf-card:hover::after,
.ltf-card.is-glow::after,
.ltf-spec-card:hover::after,
.ltf-spec-card.is-glow::after {
  opacity: 1;
  animation: ltf-edge-spin 4s linear infinite;
}

/* ── Beyond the Gear sweep ──────────────────────────────────────────── */
.ltf-upsell-list {
  overflow: hidden;
  border-radius: 12px;
  isolation: isolate;
}
.ltf-upsell-list-item {
  position: relative;
  z-index: 0;
  isolation: isolate;
  overflow: hidden;
  list-style: none !important;
  /* Solid fill so sweep band sits above this, under text */
  background-color: #00001C;
}
.ltf-upsell-list-item::marker {
  content: none !important;
  font-size: 0 !important;
}
.ltf-upsell-list-item:first-child {
  border-top-left-radius: 12px;
  border-top-right-radius: 12px;
}
.ltf-upsell-list-item:last-child {
  border-bottom-left-radius: 12px;
  border-bottom-right-radius: 12px;
  border-bottom-width: 0 !important;
}
.ltf-upsell-list-item > * {
  position: relative;
  z-index: 2;
}
.ltf-upsell-list-item::before {
  content: '▪' !important;
  color: #0B8050 !important; /* green → purple on hover / touch */
  font-size: 14px !important;
  line-height: 1.7;
  flex-shrink: 0;
  margin-right: 14px;
  position: relative;
  z-index: 2;
  transition: color 0.35s ease;
}
/*
  Sweep band UNDER the text. The item's actual copy is a raw text node
  (Webflow renders `.ltf-upsell-list-item` as a `<p>` with no wrapping
  span), and per the CSS2.1 stacking-context paint order, in-flow inline
  text (step 5) already paints ABOVE any descendant with z-index:0 or
  higher (step 6/7) but BELOW negative-z-index descendants (step 2) — so
  a positive z-index here was actually putting the gradient IN FRONT of
  the copy. z-index:-1 fixes that while `isolation: isolate` above keeps
  it scoped to this item's own stacking context (so it still paints above
  this item's own #00001C fill from step 1, not some page-level ancestor).
*/
.ltf-upsell-list-item::after {
  content: '' !important;
  position: absolute !important;
  inset: 0 !important;
  z-index: -1 !important;
  border-radius: inherit !important;
  background-image: linear-gradient(
    90deg,
    rgba(112, 64, 192, 0) 0%,
    rgba(11, 128, 80, 0.55) 10%,
    rgba(42, 170, 184, 0.75) 22%,
    rgba(77, 37, 157, 0.78) 36%,
    rgba(112, 64, 192, 0.85) 50%,
    rgba(77, 37, 157, 0.78) 64%,
    rgba(42, 170, 184, 0.75) 78%,
    rgba(11, 128, 80, 0.55) 90%,
    rgba(112, 64, 192, 0) 100%
  ) !important;
  background-size: 300% 100% !important;
  /*
    NOT !important: CSS-Cascade ranks keyframe animations BELOW author
    !important declarations, so an !important here would permanently pin
    the value and the `ltf-upsell-sweep` animation below could visibly
    "run" (Web Animations API reports it active) while never actually
    moving anything on screen. This plain value only sets the idle
    (opacity:0, pre-hover) position; the animation freely overrides it.
  */
  background-position: 0% 50%;
  background-repeat: repeat-x !important;
  opacity: 0 !important;
  pointer-events: none !important;
  transition: opacity 0.3s ease;
}
.ltf-upsell-list-item:hover::after,
.ltf-upsell-list-item.is-sweep::after,
.ltf-upsell-list-item:active::after {
  opacity: 1 !important;
  animation: ltf-upsell-sweep 6s linear infinite !important;
}
.ltf-upsell-list-item:hover::before,
.ltf-upsell-list-item.is-sweep::before,
.ltf-upsell-list-item:active::before {
  color: #7040C0 !important;
}

.ltf-section.is-trenches,
