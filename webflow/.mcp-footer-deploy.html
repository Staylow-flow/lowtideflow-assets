<script>
(function () { 'use strict'; function syncSliderValue(slider) { var targetId = slider.getAttribute('data-iq-value-target'); if (!targetId) return; var target = document.getElementById(targetId); if (!target) return; var step = parseFloat(slider.getAttribute('data-iq-step') || slider.step || '1'); var raw = parseFloat(slider.value); var display = step >= 1 ? String(Math.round(raw)) : String(Math.round(raw)); target.textContent = display; slider.setAttribute('aria-valuenow', display); } function snapValue(slider, raw) { var min = parseFloat(slider.min); var max = parseFloat(slider.max); var step = parseFloat(slider.getAttribute('data-iq-step') || slider.step); var snapped = min + Math.round((raw - min) / step) * step; return Math.min(max, Math.max(min, snapped)); } function animateSliderTo(slider, target, done) { var start = parseFloat(slider.value); if (start === target) { slider.value = String(target); syncSliderValue(slider); if (done) done(); return; } var duration = 180; var startTime = null; function frame(ts) { if (!startTime) startTime = ts; var t = Math.min(1, (ts - startTime) / duration); var eased = 1 - Math.pow(1 - t, 3); var current = start + (target - start) * eased; slider.value = String(current); syncSliderValue(slider); if (t < 1) { requestAnimationFrame(frame); } else { slider.value = String(target); syncSliderValue(slider); if (done) done(); } } requestAnimationFrame(frame); } function initMagneticSlider(slider) { var step = parseFloat(slider.getAttribute('data-iq-step') || slider.step); var smoothStep = Math.max(step / 24, 0.01); var dragging = false; slider.addEventListener('pointerdown', function () { dragging = true; slider.step = String(smoothStep); }); function finishDrag() { if (!dragging) return; dragging = false; slider.step = String(step); var target = snapValue(slider, parseFloat(slider.value)); animateSliderTo(slider, target); } slider.addEventListener('pointerup', finishDrag); slider.addEventListener('pointercancel', finishDrag); slider.addEventListener('input', function () { syncSliderValue(slider); }); slider.addEventListener('change', function () { slider.step = String(step); var target = snapValue(slider, parseFloat(slider.value)); slider.value = String(target); syncSliderValue(slider); }); syncSliderValue(slider); } function initSliders() { document.querySelectorAll('.iq-range[data-iq-value-target]').forEach(initMagneticSlider); } function setSplitVisible(isOn) { var splitRow = document.getElementById('split-row-wrapper'); if (!splitRow) return; if (isOn) { splitRow.classList.add('is-visible'); splitRow.style.maxHeight = splitRow.scrollHeight + 'px'; return; } splitRow.style.maxHeight = splitRow.scrollHeight + 'px'; requestAnimationFrame(function () { splitRow.classList.remove('is-visible'); splitRow.style.maxHeight = '0px'; }); } function initSplitToggle() { var toggle = document.getElementById('iq-split-toggle'); if (!toggle) return; setSplitVisible(toggle.checked); toggle.addEventListener('change', function () { setSplitVisible(toggle.checked); }); } function initQualityToggle() { var track = document.querySelector('.iq-toggle-track'); if (!track) return; track.addEventListener('click', function (event) { var btn = event.target.closest('.iq-toggle-btn'); if (!btn || !track.contains(btn)) return; event.preventDefault(); track.querySelectorAll('.iq-toggle-btn').forEach(function (el) { el.classList.remove('is-active'); }); btn.classList.add('is-active'); }); } function init() { initSliders(); initSplitToggle(); initQualityToggle(); } if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); } })();
</script>
