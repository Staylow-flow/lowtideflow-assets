<div class="iq-slider-control">
  <div class="iq-slider-ticks" data-tick-count="5" aria-hidden="true">
    <span class="iq-slider-track-line"></span>
    <span class="iq-slider-tick"></span>
    <span class="iq-slider-tick"></span>
    <span class="iq-slider-tick"></span>
    <span class="iq-slider-tick"></span>
    <span class="iq-slider-tick"></span>
  </div>
  <input
    type="range"
    class="iq-range"
    id="iq-slider-print-locations"
    name="print-locations"
    min="1"
    max="5"
    step="1"

    data-iq-step="1"
    aria-label="Print Locations"
    aria-valuemin="1"
    aria-valuemax="5"
    aria-valuenow="4"
    data-iq-value-target="iq-val-print-locations"
  />
</div>
