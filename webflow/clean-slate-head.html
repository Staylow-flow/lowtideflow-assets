<!--
  CLEAN SLATE — Page Head Custom Code
  Paste into: Page Settings → Custom Code → Inside <head> tag

  SPLIT OF RESPONSIBILITIES (Webflow-native + minimal custom code):

  WEBFLOW DESIGNER (editable in Style panel):
  - ltf-nav-btn / ltf-nav-btn-quote — default: white fill, navy text
  - Same classes → Hover pseudo: navy fill (#06142E), white text
  - Padding, font, radius, transitions — all in Webflow

  WEBFLOW DESIGNER — nav text links (ltf-nav-link):
  - Default + Hover opacity — Style panel
  - Gradient text fill + letter glow on hover — head CSS (below)

  THIS FILE ONLY (Webflow cannot do keyframes / animated gradients):
  - @keyframes + gradient ring on .ltf-btn-gradient-wrap:hover
  - Nav text link gradient fill via background-clip: text
  - Hero CTA ring mask (transparent → navy on hover)
  - Click-pulse mirror (.ltf-btn-gradient-active) for JS footer script
-->
<style>
  :root {
    --site-max-width: 1400px;
    /* Preferred and max carry the full +50%. The floor moves less, because at
       phone widths the clamp min is what renders and a literal +50% there
       pushes the headline to ~60px and wraps it to four lines. */
    --fluid-h1: clamp(2.25rem, 6.75vw, 6.075rem);
    --fluid-h2: clamp(2.5rem, 5.2vw, 4.5rem);
    --fluid-padding: clamp(2rem, 5vw, 5rem);
    --ltf-gutter-mid: 3rem;
    --ltf-copy-pad-left: 50px;
  }

  /* Site standard: 1400px cage (Hero locks this pattern for all sections) */
  .ltf-site-cage,
  .section-wrapper {
    position: relative;
    width: 100%;
    max-width: var(--site-max-width);
    margin-right: auto;
    margin-left: auto;
    padding-left: var(--fluid-padding);
    padding-right: var(--fluid-padding);
    box-sizing: border-box;
  }

  .ltf-main-header,
  .hero-h1 {
    font-size: var(--fluid-h1);
    line-height: 0.95;
    letter-spacing: -0.02em;
  }

  .ltf-section-header,
  .ltf-section-header-navy {
    font-size: var(--fluid-h2) !important;
    line-height: 0.92;
    max-width: none;
  }

  .ltf-body-text,
  .ltf-body-text-navy {
    font-size: 20px;
    max-width: none !important;
    width: 100%;
  }

  /* Rock stays absolute inside the relative 1400px hero cage */
  .ltf-hero > .ltf-site-cage {
    height: 100%;
    min-height: 100%;
  }

  .ltf-site-cage > .hero-canvas-wrapper {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
  }

  @keyframes ltf-nebula-gradient-shift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .ltf-hero-bottom-bar .ltf-btn-gradient-wrap,
  .ltf-nav-actions .ltf-btn-gradient-wrap {
    pointer-events: auto;
  }

  .ltf-body-text,
  .ltf-btn-primary.is-hero-cta,
  .ltf-nav-link,
  .ltf-nav-btn,
  .ltf-nav-btn-quote {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-synthesis: none;
  }

  /* Gradient ring + outer glow — wrapper only; button colors live in Webflow.
     Ring lives on ::before and fades via opacity so it composites on the GPU
     instead of repainting a background-position animation every frame. */
  .ltf-btn-gradient-wrap {
    position: relative;
    display: inline-block;
    padding: 2px;
    border-radius: 5px;
    background: transparent;
    transition: box-shadow 0.35s ease;
  }

  .ltf-btn-gradient-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(45deg, #4D259D, #2AAAB8, #1F7781, #0B8050, #7040C0, #4D259D);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  /* Keep the button above the ring so only the 2px padding shows gradient */
  .ltf-btn-gradient-wrap > * {
    position: relative;
    z-index: 1;
  }

  .ltf-btn-gradient-wrap:hover::before,
  .ltf-btn-gradient-wrap:focus-within::before,
  .ltf-btn-gradient-wrap.ltf-btn-gradient-active::before {
    opacity: 1;
  }

  .ltf-btn-gradient-wrap:hover,
  .ltf-btn-gradient-wrap:focus-within,
  .ltf-btn-gradient-wrap.ltf-btn-gradient-active {
    box-shadow:
      0 0 16px rgba(77, 37, 157, 0.45),
      0 0 28px rgba(31, 119, 129, 0.28);
  }

  /* Nav text links — gradient text fill + soft glow (plain text, not button boxes) */
  .ltf-nav-links .ltf-nav-link {
    background-image: none;
    background-clip: border-box;
    -webkit-background-clip: border-box;
    -webkit-text-fill-color: currentColor;
    -webkit-text-stroke: 0 transparent;
    transition: opacity 0.25s ease, filter 0.25s ease;
  }

  .ltf-nav-links .ltf-nav-link:hover,
  .ltf-nav-links .ltf-nav-link:focus-visible {
    opacity: 1;
    background-image: linear-gradient(45deg, #4D259D, #2AAAB8, #1F7781, #0B8050, #7040C0, #4D259D);
    background-size: 200% 200%;
    animation: ltf-nebula-gradient-shift 3s linear infinite;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter:
      drop-shadow(0 0 5px rgba(77, 37, 157, 0.21))
      drop-shadow(0 0 12px rgba(42, 170, 184, 0.14))
      drop-shadow(0 0 20px rgba(31, 119, 129, 0.09));
  }

  /* Click pulse — mirrors Webflow hover colors (JS adds .ltf-btn-gradient-active) */
  .ltf-nav-actions .ltf-btn-gradient-wrap.ltf-btn-gradient-active > .ltf-nav-btn,
  .ltf-nav-actions .ltf-btn-gradient-wrap.ltf-btn-gradient-active > .ltf-nav-btn-quote {
    background-color: #06142E;
    color: #FFFFFF;
  }

  /* Hero CTA — special case: transparent at rest, navy masks center on hover */
  .ltf-hero-bottom-bar .ltf-btn-gradient-wrap > .ltf-btn-primary.is-hero-cta {
    display: inline-flex;
    position: relative;
    z-index: 1;
    background: transparent !important;
    background-color: transparent !important;
    background-image: none !important;
    color: #FFFFFF !important;
    border: 1px solid #FFFFFF !important;
    border-radius: 3px !important;
  }

  .ltf-hero-bottom-bar .ltf-btn-gradient-wrap:hover > .ltf-btn-primary.is-hero-cta,
  .ltf-hero-bottom-bar .ltf-btn-gradient-wrap:focus-within > .ltf-btn-primary.is-hero-cta,
  .ltf-hero-bottom-bar .ltf-btn-gradient-wrap.ltf-btn-gradient-active > .ltf-btn-primary.is-hero-cta {
    background: #06142E !important;
    background-color: #06142E !important;
    background-image: none !important;
    border-color: transparent !important;
    color: #FFFFFF !important;
  }

  /* Mobile nav — hamburger toggle + slide-down panel (≤991px) */
  .ltf-nav-toggle {
    flex-shrink: 0;
    border: none;
    -webkit-appearance: none;
    appearance: none;
    text-decoration: none;
    color: inherit;
  }

  .ltf-nav-toggle:focus-visible {
    outline: 2px solid rgba(42, 170, 184, 0.85);
    outline-offset: 3px;
  }

  .ltf-site-nav.is-nav-open .ltf-nav-toggle .ltf-nav-toggle-bar:nth-of-type(1) {
    transform: translateY(7px) rotate(45deg);
  }

  .ltf-site-nav.is-nav-open .ltf-nav-toggle .ltf-nav-toggle-bar:nth-of-type(2) {
    opacity: 0;
    transform: scaleX(0);
  }

  .ltf-site-nav.is-nav-open .ltf-nav-toggle .ltf-nav-toggle-bar:nth-of-type(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  .ltf-nav-toggle-bar {
    transition: transform 0.25s ease, opacity 0.2s ease;
    width: 22px;
    height: 2px;
    background-color: #FFFFFF;
    border-radius: 1px;
    flex-shrink: 0;
  }

  .ltf-nav-inner > .ltf-nav-toggle.w-button {
    padding: 0 !important;
    background-color: transparent !important;
    background-image: none !important;
    color: #FFFFFF !important;
    line-height: 1 !important;
    font-size: 0 !important;
    min-height: 44px !important;
    box-shadow: none !important;
  }

  body.ltf-nav-open {
    overflow: hidden;
  }

  @media (max-width: 991px) {
    .ltf-nav-inner {
      display: grid !important;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      justify-content: unset;
    }

    .ltf-nav-toggle .ltf-nav-toggle-bar {
      display: block !important;
      flex-shrink: 0;
      width: 22px !important;
      height: 2px !important;
      background-color: #FFFFFF !important;
      border-radius: 1px !important;
      opacity: 1 !important;
      visibility: visible !important;
    }

    .ltf-nav-inner > .ltf-nav-toggle {
      display: flex !important;
      visibility: visible !important;
      opacity: 1 !important;
      width: 44px !important;
      height: 44px !important;
      min-width: 44px !important;
      min-height: 44px !important;
    }

    /* Toggle must live OUTSIDE .ltf-nav-mobile-panel — panel is display:none when closed */
    .ltf-nav-mobile-panel .ltf-nav-toggle {
      display: none !important;
    }

    .ltf-nav-toggle {
      display: flex !important;
      position: relative;
      z-index: 102 !important;
      grid-column: 3;
      grid-row: 1;
      justify-self: end;
      margin-left: 0 !important;
      margin-right: 0 !important;
      pointer-events: auto;
    }

    .ltf-nav-toggle .ltf-nav-toggle-bar {
      display: block;
      flex-shrink: 0;
    }

    .ltf-nav-logo {
      display: block !important;
      grid-column: 2;
      grid-row: 1;
      justify-self: center;
      z-index: 1;
      height: 21px;
      width: auto;
      max-width: 56.25vw;
      object-fit: contain;
      pointer-events: auto;
    }

    .ltf-hero .hero-canvas-wrapper {
      overflow: hidden;
    }

    .ltf-hero-logo {
      display: none !important;
    }

    .ltf-hero-headline {
      padding-left: 5% !important;
      padding-right: 5% !important;
      box-sizing: border-box !important;
    }

    .ltf-main-header {
      padding-left: 0;
      padding-right: 0;
    }

    /* Hero CTA — gradient ring always on for mobile, static (no repaint loop) */
    .ltf-hero-bottom-bar .ltf-btn-gradient-wrap::before {
      opacity: 1;
    }

    .ltf-hero-bottom-bar .ltf-btn-gradient-wrap {
      box-shadow:
        0 0 16px rgba(77, 37, 157, 0.45),
        0 0 28px rgba(31, 119, 129, 0.28);
    }

    .ltf-hero-bottom-bar .ltf-btn-gradient-wrap > .ltf-btn-primary.is-hero-cta {
      background: #06142E !important;
      background-color: #06142E !important;
      border-color: transparent !important;
      color: #FFFFFF !important;
    }

    .ltf-hero-bottom-bar {
      text-align: center;
    }

    .ltf-hero-bottom-bar .ltf-btn-gradient-wrap {
      margin-left: auto;
      margin-right: auto;
    }

    .ltf-nav-mobile-panel {
      display: none;
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      bottom: auto;
      z-index: 99;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 0;
      width: 100%;
      height: auto;
      max-height: none;
      padding: 28px clamp(20px, 5vw, 32px) 32px;
      overflow: hidden;
      background: rgba(6, 20, 46, 0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ltf-site-nav.is-nav-open .ltf-nav-mobile-panel {
      display: flex;
    }

    .ltf-nav-mobile-panel .ltf-nav-links {
      position: static;
      left: auto;
      top: auto;
      transform: none;
      flex-direction: column;
      align-items: flex-start;
      gap: 24px;
      width: 100%;
      margin: 0 0 28px;
      padding: 0;
      flex-shrink: 0;
    }

    .ltf-nav-mobile-panel .ltf-nav-link {
      font-size: 19px;
      letter-spacing: 0.14em;
    }

    .ltf-nav-mobile-panel .ltf-nav-actions {
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      height: auto;
      gap: 12px;
      margin: 0;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .ltf-nav-mobile-panel .ltf-btn-gradient-wrap {
      display: block;
      width: 100%;
    }

    .ltf-nav-mobile-panel .ltf-nav-btn,
    .ltf-nav-mobile-panel .ltf-nav-btn-quote {
      width: 100%;
      justify-content: center;
      text-align: center;
    }
  }

  /* ════════════════════════════════════════════════════════════════════
     UNIFIED TWO-COLUMN RHYTHM

     Specs, Trenches, and Beyond the Gear all sit in the same 1400 cage
     with the same 80px edge. Parent section padding is zeroed on the
     split/upsell sections so it cannot double-up against the cage and
     shove those copy columns inboard of Specs.

     Copy stacks then share one box: +50px left pad, full left-column
     width, no leftover Webflow max-widths (520px / 16em / 720px).
     ════════════════════════════════════════════════════════════════════ */
  .ltf-section:has(.ltf-split),
  .ltf-upsell {
    padding-left: 0 !important;
    padding-right: 0 !important;
  }

  .ltf-section-inner,
  .ltf-upsell-inner,
  .ltf-vault-cage {
    box-sizing: border-box;
    width: 100%;
    max-width: var(--site-max-width) !important;
    margin-left: auto;
    margin-right: auto;
    padding-left: var(--fluid-padding) !important;
    padding-right: var(--fluid-padding) !important;
  }

  .ltf-vault-cage {
    justify-content: stretch;
    align-items: start;
    gap: var(--ltf-gutter-mid);
  }

  @media (min-width: 992px) {
    .ltf-vault-cage,
    .ltf-split,
    .ltf-upsell-grid {
      display: grid !important;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: var(--ltf-gutter-mid) !important;
      align-items: start;
    }

    .ltf-specs-vault-header,
    .ltf-split > .ltf-stack,
    .ltf-upsell-grid > .ltf-stack {
      box-sizing: border-box;
      width: 100% !important;
      max-width: none !important;
      min-width: 0;
      flex: none;
      justify-self: stretch;
      padding-left: var(--ltf-copy-pad-left) !important;
      padding-right: 0 !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
    }

    .ltf-specs-vault-header > *,
    .ltf-split > .ltf-stack > *,
    .ltf-upsell-grid > .ltf-stack > * {
      width: 100%;
      max-width: none !important;
    }

    /* Force SPECs & / STANDARDS onto two lines at the 1400 cage. */
    .ltf-specs-vault-header .ltf-section-header-navy {
      max-width: 6.4em !important;
    }

    /* Assets sit in the middle of the right column (3rd quarter). */
    .ltf-specs-vault-cards,
    .ltf-authority-image-box,
    .ltf-magnifier,
    .ltf-upsell-list {
      width: 100%;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      justify-self: center;
    }

    .ltf-hero-bottom-bar {
      left: var(--fluid-padding);
    }

    /* Orange figure: 50px inboard so it shares the Q3 asset axis. */
    .ltf-hero-figure,
    .ltf-hero-figure-img {
      right: 50px !important;
      transform: none !important;
    }
  }

  /* ── Specs vault: 60px narrower from the right, left edge held ──────── */
  .ltf-specs-vault-cards {
    flex: 0 0 auto !important;
    width: 500px !important;
    max-width: 500px !important;
  }

  .ltf-spec-card,
  .ltf-spec-card.ltf-spec-card-01,
  .ltf-spec-card.ltf-spec-card-02,
  .ltf-spec-card.ltf-spec-card-03,
  .ltf-spec-card.ltf-spec-card-04 {
    width: 460px;
    max-width: 460px;
    height: 340px;
    min-height: 340px;
    max-height: 340px;
    padding-left: 64px;
    padding-right: 64px;
  }

  .ltf-spec-card.ltf-spec-card-02 { top: 12px; left: 12px; }
  .ltf-spec-card.ltf-spec-card-03 { top: 24px; left: 24px; }
  .ltf-spec-card.ltf-spec-card-04 { top: 36px; left: 36px; }

  /* ── Beyond the Gear: fill the Q3 column, sweep on hover ────────────── */
  @keyframes ltf-upsell-sweep {
    from { background-position: 0% 50%; }
    to   { background-position: 100% 50%; }
  }

  .ltf-upsell-list {
    margin-top: 0;
    max-width: 100%;
    width: 100%;
    margin-left: auto;
    margin-right: auto;
    overflow: hidden;
  }

  .ltf-upsell-list-item {
    position: relative;
    display: flex;
    align-items: flex-start;
    font-size: 20px;
    line-height: 1.3;
    padding: 22px 28px 22px 24px;
    isolation: isolate;
    overflow: hidden;
    transition: color 0.3s ease, border-color 0.3s ease;
  }

  .ltf-upsell-list-item::before {
    content: '\25AA';
    color: #2AAAB8;
    font-size: 11px;
    line-height: 1.7;
    flex-shrink: 0;
    margin-right: 14px;
    position: relative;
    z-index: 1;
  }

  .ltf-upsell-list-item::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(112, 64, 192, 0.22) 38%,
      rgba(42, 170, 184, 0.28) 50%,
      rgba(112, 64, 192, 0.22) 62%,
      transparent 100%
    );
    background-size: 220% 100%;
    background-position: 0% 50%;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .ltf-upsell-list-item:hover::after {
    opacity: 1;
    animation: ltf-upsell-sweep 3.4s linear infinite;
  }

  .ltf-upsell-list-item:hover::before {
    color: #7040C0;
  }

  /* ── Trenches: portrait magnifier host ──────────────────────────────── */
  .ltf-authority-image-box,
  .ltf-magnifier {
    position: relative;
    aspect-ratio: 3 / 4;
    width: 100%;
    max-width: 520px;
    max-height: none;
    min-height: 420px;
    overflow: hidden;
    background-color: #06142e;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-left: 2px solid #2AAAB8;
    cursor: none;
  }

  .ltf-authority-image-box > img,
  .ltf-magnifier-base {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .ltf-magnifier-lens {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    width: 168px;
    height: 168px;
    border-radius: 50%;
    overflow: hidden;
    isolation: isolate;
    pointer-events: none;
    opacity: 0;
    will-change: transform;
    box-shadow:
      0 0 0 2px rgba(42, 170, 184, 0.85),
      0 0 18px rgba(112, 64, 192, 0.55),
      0 0 36px rgba(31, 119, 129, 0.35);
    transition: opacity 0.2s ease;
  }

  .ltf-magnifier.is-lit .ltf-magnifier-lens,
  .ltf-authority-image-box.is-lit .ltf-magnifier-lens {
    opacity: 1;
  }

  .ltf-magnifier-print {
    position: absolute;
    top: 0;
    left: 0;
    max-width: none;
    object-fit: cover;
    pointer-events: none;
  }

  /* Same-source fallback: the reveal still reads as a printed pass by
     pushing teal/violet into the fabric until a real print plate is wired
     via data-ltf-print-src. */
  .ltf-magnifier.is-same-src .ltf-magnifier-print {
    filter: saturate(1.35) contrast(1.12) hue-rotate(-12deg);
  }

  .ltf-magnifier-print-tint {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, rgba(77, 37, 157, 0.28), rgba(42, 170, 184, 0.22)),
      repeating-linear-gradient(
        -18deg,
        transparent 0 7px,
        rgba(11, 128, 80, 0.18) 7px 8px
      );
    mix-blend-mode: color;
    pointer-events: none;
  }

  @media (max-width: 991px) {
    .ltf-authority-image-box,
    .ltf-magnifier {
      min-height: 320px;
      cursor: auto;
    }
  }

  /* ── The Squad: cards +25px, position tracks window scroll ──────────── */
  @property --ltf-edge-angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  @keyframes ltf-edge-spin {
    to { --ltf-edge-angle: 360deg; }
  }

  .ltf-section:has(.ltf-cards-grid) {
    overflow-x: clip;
  }

  .ltf-cards-grid {
    gap: 40px;
  }

  @media (min-width: 992px) {
    .ltf-cards-grid {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .ltf-card {
      width: calc(75% + 25px);
      justify-self: center;
    }
  }

  .ltf-card {
    position: relative;
    min-height: clamp(320px, 26vw, 440px);
    will-change: transform;
  }

  /* Ring only: the gradient fills the box, then a two-layer mask punches the
     middle out so just the 3px edge paints. Cheaper than a blurred duplicate
     and it never bleeds over the card's own text. */
  .ltf-card::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 15px;
    padding: 3px;
    background: conic-gradient(
      from var(--ltf-edge-angle),
      #4D259D, #2AAAB8, #1F7781, #0B8050, #7040C0, #4D259D
    );
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .ltf-card:hover::after {
    opacity: 1;
    animation: ltf-edge-spin 4s linear infinite;
  }
