<!--
  CLEAN SLATE — Page Head Custom Code
  Paste into: Page Settings → Custom Code → Inside <head> tag

  SPLIT OF RESPONSIBILITIES:

  WEBFLOW DESIGNER owns (do not override here):
  - Default padding, radius, and static placement you want to tweak in the
    Style panel

  THIS FILE ONLY (things Designer cannot do):
  - @keyframes, gradient rings, hover sweep, crew scroll-dock transforms
  - Layout lock: .ltf-cage / .ltf-split-2 / .ltf-split-copy / .ltf-split-asset
  - Hero H1: clamp(40px, 7vw, 112px) — min 40, max 112, half the previous lock
-->
<style>
  :root {
    --site-max-width: 1400px;
    --ltf-side-pad: 80px;
    --ltf-section-pad-y: 100px;
    --ltf-gutter-mid: 80px;
    --ltf-col: 580px;
    --ltf-split-inset: 40px;
    --fluid-padding: var(--ltf-side-pad);
  }

  @media (max-width: 991px) {
    :root {
      --ltf-side-pad: 24px;
      --ltf-section-pad-y: 64px;
      --ltf-gutter-mid: 32px;
      --ltf-split-inset: 0px;
    }
  }

  /* Site standard: 1400px cage (Hero locks this pattern for all sections) */
  .ltf-site-cage,
  .section-wrapper,
  .ltf-cage {
    position: relative;
    width: 100%;
    max-width: var(--site-max-width);
    margin-right: auto;
    margin-left: auto;
    padding-left: var(--ltf-side-pad);
    padding-right: var(--ltf-side-pad);
    box-sizing: border-box;
  }

  /* Half the previous 14vw / 14rem lock. Bounds are pixels so min/max
     are readable in the file: 40px floor, 112px ceiling. */
  .ltf-main-header,
  .hero-h1 {
    font-size: clamp(40px, 7vw, 112px) !important;
    line-height: 0.95;
    letter-spacing: -0.02em;
  }

  .ltf-section-header,
  .ltf-section-header-navy {
    line-height: 0.92;
    max-width: none;
  }

  .ltf-body-text,
  .ltf-body-text-navy {
    max-width: none !important;
    width: 100%;
  }

  /* Rock stays absolute inside the relative 1400px hero cage */
  .ltf-hero > .ltf-site-cage {
    height: 100%;
    min-height: 100%;
  }

  .ltf-site-cage > .hero-canvas-wrapper {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
  }

  @keyframes ltf-nebula-gradient-shift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .ltf-hero-bottom-bar .ltf-btn-gradient-wrap,
  .ltf-nav-actions .ltf-btn-gradient-wrap {
    pointer-events: auto;
  }

  .ltf-body-text,
  .ltf-btn-primary.is-hero-cta,
  .ltf-nav-link,
  .ltf-nav-btn,
  .ltf-nav-btn-quote {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-synthesis: none;
  }

  /* Gradient ring + outer glow — wrapper only; button colors live in Webflow.
     Ring lives on ::before and fades via opacity so it composites on the GPU
     instead of repainting a background-position animation every frame. */
  .ltf-btn-gradient-wrap {
    position: relative;
    display: inline-block;
    padding: 2px;
    border-radius: 5px;
    background: transparent;
    transition: box-shadow 0.35s ease;
  }

  .ltf-btn-gradient-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(45deg, #4D259D, #2AAAB8, #1F7781, #0B8050, #7040C0, #4D259D);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  /* Keep the button above the ring so only the 2px padding shows gradient */
  .ltf-btn-gradient-wrap > * {
    position: relative;
    z-index: 1;
  }

  .ltf-btn-gradient-wrap:hover::before,
  .ltf-btn-gradient-wrap:focus-within::before,
  .ltf-btn-gradient-wrap.ltf-btn-gradient-active::before {
    opacity: 1;
  }

  .ltf-btn-gradient-wrap:hover,
  .ltf-btn-gradient-wrap:focus-within,
  .ltf-btn-gradient-wrap.ltf-btn-gradient-active {
    box-shadow:
      0 0 16px rgba(77, 37, 157, 0.45),
      0 0 28px rgba(31, 119, 129, 0.28);
  }

  /* Nav text links — gradient text fill + soft glow (plain text, not button boxes) */
  .ltf-nav-links .ltf-nav-link {
    background-image: none;
    background-clip: border-box;
    -webkit-background-clip: border-box;
    -webkit-text-fill-color: currentColor;
    -webkit-text-stroke: 0 transparent;
    transition: opacity 0.25s ease, filter 0.25s ease;
  }

  .ltf-nav-links .ltf-nav-link:hover,
  .ltf-nav-links .ltf-nav-link:focus-visible {
    opacity: 1;
    background-image: linear-gradient(45deg, #4D259D, #2AAAB8, #1F7781, #0B8050, #7040C0, #4D259D);
    background-size: 200% 200%;
    animation: ltf-nebula-gradient-shift 3s linear infinite;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter:
      drop-shadow(0 0 5px rgba(77, 37, 157, 0.21))
      drop-shadow(0 0 12px rgba(42, 170, 184, 0.14))
      drop-shadow(0 0 20px rgba(31, 119, 129, 0.09));
  }

  /* Click pulse — mirrors Webflow hover colors (JS adds .ltf-btn-gradient-active) */
  .ltf-nav-actions .ltf-btn-gradient-wrap.ltf-btn-gradient-active > .ltf-nav-btn,
  .ltf-nav-actions .ltf-btn-gradient-wrap.ltf-btn-gradient-active > .ltf-nav-btn-quote {
    background-color: #06142E;
    color: #FFFFFF;
  }

  /* Hero CTA — special case: transparent at rest, navy masks center on hover */
  .ltf-hero-bottom-bar .ltf-btn-gradient-wrap > .ltf-btn-primary.is-hero-cta {
    display: inline-flex;
    position: relative;
    z-index: 1;
    background: transparent !important;
    background-color: transparent !important;
    background-image: none !important;
    color: #FFFFFF !important;
    border: 1px solid #FFFFFF !important;
    border-radius: 3px !important;
  }

  .ltf-hero-bottom-bar .ltf-btn-gradient-wrap:hover > .ltf-btn-primary.is-hero-cta,
  .ltf-hero-bottom-bar .ltf-btn-gradient-wrap:focus-within > .ltf-btn-primary.is-hero-cta,
  .ltf-hero-bottom-bar .ltf-btn-gradient-wrap.ltf-btn-gradient-active > .ltf-btn-primary.is-hero-cta {
    background: #06142E !important;
    background-color: #06142E !important;
    background-image: none !important;
    border-color: transparent !important;
    color: #FFFFFF !important;
  }

  /* Mobile nav — hamburger toggle + slide-down panel (≤991px) */
  .ltf-nav-toggle {
    flex-shrink: 0;
    border: none;
    -webkit-appearance: none;
    appearance: none;
    text-decoration: none;
    color: inherit;
  }

  .ltf-nav-toggle:focus-visible {
    outline: 2px solid rgba(42, 170, 184, 0.85);
    outline-offset: 3px;
  }

  .ltf-site-nav.is-nav-open .ltf-nav-toggle .ltf-nav-toggle-bar:nth-of-type(1) {
    transform: translateY(7px) rotate(45deg);
  }

  .ltf-site-nav.is-nav-open .ltf-nav-toggle .ltf-nav-toggle-bar:nth-of-type(2) {
    opacity: 0;
    transform: scaleX(0);
  }

  .ltf-site-nav.is-nav-open .ltf-nav-toggle .ltf-nav-toggle-bar:nth-of-type(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  .ltf-nav-toggle-bar {
    transition: transform 0.25s ease, opacity 0.2s ease;
    width: 22px;
    height: 2px;
    background-color: #FFFFFF;
    border-radius: 1px;
    flex-shrink: 0;
  }

  .ltf-nav-inner > .ltf-nav-toggle.w-button {
    padding: 0 !important;
    background-color: transparent !important;
    background-image: none !important;
    color: #FFFFFF !important;
    line-height: 1 !important;
    font-size: 0 !important;
    min-height: 44px !important;
    box-shadow: none !important;
  }

  body.ltf-nav-open {
    overflow: hidden;
  }

  @media (max-width: 991px) {
    .ltf-nav-inner {
      display: grid !important;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      justify-content: unset;
    }

    .ltf-nav-toggle .ltf-nav-toggle-bar {
      display: block !important;
      flex-shrink: 0;
      width: 22px !important;
      height: 2px !important;
      background-color: #FFFFFF !important;
      border-radius: 1px !important;
      opacity: 1 !important;
      visibility: visible !important;
    }

    .ltf-nav-inner > .ltf-nav-toggle {
      display: flex !important;
      visibility: visible !important;
      opacity: 1 !important;
      width: 44px !important;
      height: 44px !important;
      min-width: 44px !important;
      min-height: 44px !important;
    }

    /* Toggle must live OUTSIDE .ltf-nav-mobile-panel — panel is display:none when closed */
    .ltf-nav-mobile-panel .ltf-nav-toggle {
      display: none !important;
    }

    .ltf-nav-toggle {
      display: flex !important;
      position: relative;
      z-index: 102 !important;
      grid-column: 3;
      grid-row: 1;
      justify-self: end;
      margin-left: 0 !important;
      margin-right: 0 !important;
      pointer-events: auto;
    }

    .ltf-nav-toggle .ltf-nav-toggle-bar {
      display: block;
      flex-shrink: 0;
    }

    .ltf-nav-logo {
      display: block !important;
      grid-column: 2;
      grid-row: 1;
      justify-self: center;
      z-index: 1;
      height: 21px;
      width: auto;
      max-width: 56.25vw;
      object-fit: contain;
      pointer-events: auto;
    }

    .ltf-hero .hero-canvas-wrapper {
      overflow: hidden;
    }

    .ltf-hero-logo {
      display: none !important;
    }

    .ltf-hero-headline {
      padding-left: 5% !important;
      padding-right: 5% !important;
      box-sizing: border-box !important;
    }

    .ltf-main-header {
      padding-left: 0;
      padding-right: 0;
    }

    /* Hero CTA — gradient ring always on for mobile, static (no repaint loop) */
    .ltf-hero-bottom-bar .ltf-btn-gradient-wrap::before {
      opacity: 1;
    }

    .ltf-hero-bottom-bar .ltf-btn-gradient-wrap {
      box-shadow:
        0 0 16px rgba(77, 37, 157, 0.45),
        0 0 28px rgba(31, 119, 129, 0.28);
    }

    .ltf-hero-bottom-bar .ltf-btn-gradient-wrap > .ltf-btn-primary.is-hero-cta {
      background: #06142E !important;
      background-color: #06142E !important;
      border-color: transparent !important;
      color: #FFFFFF !important;
    }

    .ltf-hero-bottom-bar {
      text-align: center !important;
      align-items: center !important;
      padding-left: 0 !important;
    }

    .ltf-hero-bottom-bar .ltf-btn-gradient-wrap {
      margin-left: auto;
      margin-right: auto;
      align-self: center !important;
    }

    .ltf-nav-mobile-panel {
      display: none;
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      bottom: auto;
      z-index: 99;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 0;
      width: 100%;
      height: auto;
      max-height: none;
      padding: 28px clamp(20px, 5vw, 32px) 32px;
      overflow: hidden;
      background: rgba(6, 20, 46, 0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ltf-site-nav.is-nav-open .ltf-nav-mobile-panel {
      display: flex;
    }

    .ltf-nav-mobile-panel .ltf-nav-links {
      position: static;
      left: auto;
      top: auto;
      transform: none;
      flex-direction: column;
      align-items: flex-start;
      gap: 24px;
      width: 100%;
      margin: 0 0 28px;
      padding: 0;
      flex-shrink: 0;
    }

    .ltf-nav-mobile-panel .ltf-nav-link {
      font-size: 19px;
      letter-spacing: 0.14em;
    }

    .ltf-nav-mobile-panel .ltf-nav-actions {
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      height: auto;
      gap: 12px;
      margin: 0;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .ltf-nav-mobile-panel .ltf-btn-gradient-wrap {
      display: block;
      width: 100%;
    }

    .ltf-nav-mobile-panel .ltf-nav-btn,
    .ltf-nav-mobile-panel .ltf-nav-btn-quote {
      width: 100%;
      justify-content: center;
      text-align: center;
    }
  }

  /* ════════════════════════════════════════════════════════════════════
     LOCKED LAYOUT  (every split section)

     1400 cage
       80px side pad  →  1240 inner
       100px top / bottom
       Split 2:  580 | 80 gutter | 580
         → .ltf-split-copy   left: H1 / H2 / paragraphs  (+40px inset)
         → .ltf-split-asset  right: unique JS            (+40px inset)
     Cage 80 + inner 40 on BOTH sides so the text and the JS column
     sit the same distance from the viewport edge.
     ════════════════════════════════════════════════════════════════════ */
  .ltf-section:has(.ltf-split-2),
  .ltf-section:has(.ltf-cards-grid),
  .ltf-specs-vault,
  .ltf-upsell {
    padding-left: 0 !important;
    padding-right: 0 !important;
    padding-top: var(--ltf-section-pad-y) !important;
    padding-bottom: var(--ltf-section-pad-y) !important;
  }

  .ltf-cage {
    box-sizing: border-box;
    width: 100%;
    max-width: var(--site-max-width) !important;
    margin-left: auto;
    margin-right: auto;
    padding-left: var(--ltf-side-pad) !important;
    padding-right: var(--ltf-side-pad) !important;
  }

  .ltf-split-2 {
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: var(--ltf-gutter-mid) !important;
    align-items: start;
    width: 100%;
    max-width: 1240px;
  }

  .ltf-split-copy {
    box-sizing: border-box;
    width: 100% !important;
    max-width: none !important;
    min-width: 0;
    justify-self: stretch;
    margin: 0 !important;
    padding-left: var(--ltf-split-inset) !important;
    padding-right: 0 !important;
    text-align: left !important;
    align-items: flex-start !important;
  }

  .ltf-split-copy > .ltf-section-header,
  .ltf-split-copy > .ltf-section-header-navy,
  .ltf-split-copy > .ltf-subheading,
  .ltf-split-copy > .ltf-body-text {
    width: 100%;
    max-width: none !important;
  }

  .ltf-split-asset {
    box-sizing: border-box;
    display: block !important;
    width: 100% !important;
    max-width: none !important;
    min-width: 0;
    justify-self: stretch;
    padding-left: 0 !important;
    padding-right: var(--ltf-split-inset) !important;
  }

  /* Force SPECs & / STANDARDS onto two lines at the 1400 cage. */
  .ltf-split-copy .ltf-section-header-navy {
    max-width: 6.4em !important;
  }

  /* Hero bottom bar = left split column inside the 1400 cage. Absolute
     left/width match Grid 1 (.ltf-split-copy) in the sections below.
     Logo + CTA stay shrink-wrapped so the hover ring cannot go full-bleed. */
  .ltf-hero-bottom-bar.ltf-split-copy,
  .ltf-hero-bottom-bar {
    display: flex !important;
    flex-direction: column !important;
    align-items: flex-start !important;
    text-align: left !important;
  }

  @media (min-width: 992px) {
    .ltf-hero-bottom-bar.ltf-split-copy,
    .ltf-hero-bottom-bar {
      left: var(--ltf-side-pad) !important;
      width: calc((100% - (2 * var(--ltf-side-pad)) - var(--ltf-gutter-mid)) / 2) !important;
      max-width: var(--ltf-col) !important;
      min-width: 0 !important;
      transform: none !important;
    }
  }

  .ltf-hero-bottom-bar .ltf-hero-logo {
    display: block !important;
    width: auto !important;
    max-width: none !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    align-self: flex-start !important;
  }

  .ltf-hero-bottom-bar .ltf-btn-gradient-wrap,
  .ltf-hero-bottom-bar .ltf-btn-gradient-wrap > .ltf-btn-primary {
    display: inline-flex !important;
    width: max-content !important;
    max-width: max-content !important;
    flex: 0 0 auto;
    align-self: flex-start !important;
  }

  /* Beyond the Gear: keep the Trenches copy stack. Only the list moves down
     so its top sits on the H1 baseline. */
  @media (min-width: 992px) {
    .ltf-upsell-grid .ltf-split-asset {
      margin-top: calc(clamp(2.75rem, 7vw, 6.25rem) * 0.9 + 10px) !important;
    }
  }

  @media (max-width: 991px) {
    .ltf-split-2 {
      grid-template-columns: minmax(0, 1fr);
      gap: 2rem !important;
    }
  }

  /* ── Specs vault cards ──────────────────────────────────────────────── */
  .ltf-specs-vault-cards {
    flex: 0 0 auto !important;
  }

  .ltf-spec-card,
  .ltf-spec-card.ltf-spec-card-01,
  .ltf-spec-card.ltf-spec-card-02,
  .ltf-spec-card.ltf-spec-card-03,
  .ltf-spec-card.ltf-spec-card-04 {
    width: 460px;
    max-width: 460px;
    height: 340px;
    min-height: 340px;
    max-height: 340px;
    padding-left: 64px;
    padding-right: 64px;
  }

  .ltf-spec-card.ltf-spec-card-02 { top: 12px; left: 12px; }
  .ltf-spec-card.ltf-spec-card-03 { top: 24px; left: 24px; }
  .ltf-spec-card.ltf-spec-card-04 { top: 36px; left: 36px; }

  /* ── Beyond the Gear: fill the Q3 column, sweep on hover ────────────── */
  @keyframes ltf-upsell-sweep {
    from { background-position: 100% 50%; }
    to   { background-position: 0% 50%; }
  }

  .ltf-upsell-list {
    margin-top: 0 !important;
    max-width: 100%;
    width: 100%;
    margin-left: auto;
    margin-right: auto;
    overflow: hidden;
  }

  .ltf-upsell-list-item {
    position: relative;
    display: flex;
    align-items: flex-start;
    line-height: 1.3;
    padding: 22px 28px 22px 24px;
    isolation: isolate;
    overflow: hidden;
    transition: color 0.3s ease, border-color 0.3s ease;
  }

  .ltf-upsell-list-item::before {
    content: '▪';
    color: #2AAAB8;
    font-size: 11px;
    line-height: 1.7;
    flex-shrink: 0;
    margin-right: 14px;
    position: relative;
    z-index: 1;
  }

  .ltf-upsell-list-item::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(112, 64, 192, 0.22) 38%,
      rgba(42, 170, 184, 0.28) 50%,
      rgba(112, 64, 192, 0.22) 62%,
      transparent 100%
    );
    background-size: 220% 100%;
    background-position: 100% 50%;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .ltf-upsell-list-item:hover::after {
    opacity: 1;
    animation: ltf-upsell-sweep 3.4s linear infinite;
  }

  .ltf-upsell-list-item:hover::before {
    color: #7040C0;
  }

  /* ── Trenches: thread-counter magnifier ─────────────────────────────── */
  .ltf-authority-image-box,
  .ltf-magnifier {
    position: relative;
    aspect-ratio: 3 / 4;
    width: 100%;
    max-width: 100%;
    max-height: none !important;
    min-height: 0;
    overflow: hidden;
    background: none;
    border: none;
    cursor: none;
  }

  .ltf-authority-image-box > img,
  .ltf-magnifier-base {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .ltf-magnifier:not(.is-lit) .ltf-magnifier-lens {
    opacity: 0;
  }

  .ltf-magnifier-lens {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 1;
    filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.45));
  }

  .ltf-magnifier-hole {
    position: absolute;
    overflow: hidden;
    border-radius: 50%;
    isolation: isolate;
    -webkit-mask-image: radial-gradient(circle, #000 68%, transparent 78%);
    mask-image: radial-gradient(circle, #000 68%, transparent 78%);
  }

  .ltf-magnifier-print {
    position: absolute;
    top: 0;
    left: 0;
    max-width: none;
    object-fit: cover;
    pointer-events: none;
  }

  .ltf-magnifier-glass {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    z-index: 3;
  }

  @media (max-width: 991px) {
    .ltf-authority-image-box,
    .ltf-magnifier {
      min-height: 320px;
      cursor: auto;
    }
  }

  /* ── The Crew: cards track window scroll, dock before they center ───── */
  @property --ltf-edge-angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  @keyframes ltf-edge-spin {
    to { --ltf-edge-angle: 360deg; }
  }

  .ltf-section:has(.ltf-cards-grid) {
    overflow-x: clip;
    overflow-y: visible;
  }

  .ltf-cards-grid {
    overflow: visible;
  }

  .ltf-cards-grid {
    gap: 40px;
  }

  @media (min-width: 992px) {
    .ltf-cards-grid {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .ltf-card {
      width: calc(75% + 25px);
      justify-self: center;
    }
  }

  .ltf-card {
    position: relative;
    min-height: clamp(256px, 20.8vw, 352px);
    overflow: visible;
    will-change: transform;
    transform-origin: center center;
    transition: border-color 0.35s ease;
  }
