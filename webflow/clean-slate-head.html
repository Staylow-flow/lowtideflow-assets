<!--
  CLEAN SLATE — Page Head Custom Code
  Paste into: Page Settings → Custom Code → Inside <head> tag

  SPLIT OF RESPONSIBILITIES:

  WEBFLOW DESIGNER owns:
  - Hero bottom-bar 2-col split, left copy (logo, body, CTA), and all hero text
  - Split column gap, placement, padding, radius, type, and static color

  THIS FILE ONLY (things Designer cannot do):
  - @keyframes, gradient rings, hover sweep, crew scroll-dock transforms
  - Even split insets on non-hero sections (--ltf-split-inset / --ltf-split-inner)
  - Hero H1: clamp(40px, 7vw, 112px)
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --site-max-width: 1400px;
    --ltf-side-pad: 80px;
    --ltf-section-pad-y: 100px;
    --ltf-gutter-mid: 80px;
    --ltf-col: 580px;
    --ltf-split-inset: 40px;
    --ltf-split-inner: 50px;
    --fluid-padding: var(--ltf-side-pad);
  }

  @media (max-width: 991px) {
    :root {
      --ltf-side-pad: 25px;
      --ltf-section-pad-y: 64px;
      --ltf-gutter-mid: 32px;
      --ltf-split-inset: 0px;
      --ltf-split-inner: 0px;
    }
  }

  /* Site standard: 1400px cage (Hero locks this pattern for all sections) */
  .ltf-site-cage,
  .section-wrapper,
  .ltf-cage {
    position: relative;
    width: 100%;
    max-width: var(--site-max-width);
    margin-right: auto;
    margin-left: auto;
    padding-left: var(--ltf-side-pad);
    padding-right: var(--ltf-side-pad);
    box-sizing: border-box;
  }

  /* Half the previous 14vw / 14rem lock. Bounds are pixels so min/max
     are readable in the file: 40px floor, 112px ceiling. */
  .ltf-main-header,
  .hero-h1 {
    font-size: clamp(40px, 7vw, 112px) !important;
    line-height: 0.95;
    letter-spacing: -0.02em;
  }

  .ltf-section-header,
  .ltf-section-header-navy {
    line-height: 0.92;
    max-width: none;
  }

  /* Paragraph width lives in Designer. Do not force 100% here. */

  /* Rock stays absolute inside the relative 1400px hero cage */
  .ltf-hero > .ltf-site-cage {
    height: 100%;
    min-height: 100%;
  }

  .ltf-site-cage > .hero-canvas-wrapper {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
  }

  @keyframes ltf-nebula-gradient-shift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .ltf-hero-bottom-bar .ltf-btn-gradient-wrap,
  .ltf-nav-actions .ltf-btn-gradient-wrap {
    pointer-events: auto;
  }

  .ltf-body-text,
  .ltf-btn-primary.is-hero-cta,
  .ltf-nav-link,
  .ltf-nav-btn,
  .ltf-nav-btn-quote {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-synthesis: none;
  }

  /* Gradient ring + outer glow — wrapper only; button colors live in Webflow.
     Ring lives on ::before and fades via opacity so it composites on the GPU
     instead of repainting a background-position animation every frame. */
  .ltf-btn-gradient-wrap {
    position: relative;
    display: inline-block;
    padding: 2px;
    border-radius: 5px;
    background: transparent;
    transition: box-shadow 0.35s ease;
  }

  .ltf-btn-gradient-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(45deg, #4D259D, #2AAAB8, #1F7781, #0B8050, #7040C0, #4D259D);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  /* Keep the button above the ring so only the 2px padding shows gradient */
  .ltf-btn-gradient-wrap > * {
    position: relative;
    z-index: 1;
  }

  .ltf-btn-gradient-wrap:hover::before,
  .ltf-btn-gradient-wrap:focus-within::before,
  .ltf-btn-gradient-wrap.ltf-btn-gradient-active::before {
    opacity: 1;
  }

  .ltf-btn-gradient-wrap:hover,
  .ltf-btn-gradient-wrap:focus-within,
  .ltf-btn-gradient-wrap.ltf-btn-gradient-active {
    box-shadow:
      0 0 16px rgba(77, 37, 157, 0.45),
      0 0 28px rgba(31, 119, 129, 0.28);
  }

  /* Nav text links — gradient text fill + soft glow (plain text, not button boxes) */
  .ltf-nav-links .ltf-nav-link {
    background-image: none;
    background-clip: border-box;
    -webkit-background-clip: border-box;
    -webkit-text-fill-color: currentColor;
    -webkit-text-stroke: 0 transparent;
    transition: opacity 0.25s ease, filter 0.25s ease;
  }

  .ltf-nav-links .ltf-nav-link:hover,
  .ltf-nav-links .ltf-nav-link:focus-visible {
    opacity: 1;
    background-image: linear-gradient(45deg, #4D259D, #2AAAB8, #1F7781, #0B8050, #7040C0, #4D259D);
    background-size: 200% 200%;
    animation: ltf-nebula-gradient-shift 3s linear infinite;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter:
      drop-shadow(0 0 5px rgba(77, 37, 157, 0.21))
      drop-shadow(0 0 12px rgba(42, 170, 184, 0.14))
      drop-shadow(0 0 20px rgba(31, 119, 129, 0.09));
  }

  /* Click pulse — mirrors Webflow hover colors (JS adds .ltf-btn-gradient-active) */
  .ltf-nav-actions .ltf-btn-gradient-wrap.ltf-btn-gradient-active > .ltf-nav-btn,
  .ltf-nav-actions .ltf-btn-gradient-wrap.ltf-btn-gradient-active > .ltf-nav-btn-quote {
    background-color: #06142E;
    color: #FFFFFF;
  }

  /* Hero CTA uses the same Instant Quote wrap + .ltf-btn-primary as the funnel. */

  /* Mobile nav — hamburger toggle + slide-down panel (≤991px) */
  .ltf-nav-toggle {
    flex-shrink: 0;
    border: none;
    -webkit-appearance: none;
    appearance: none;
    text-decoration: none;
    color: inherit;
  }

  .ltf-nav-toggle:focus-visible {
    outline: 2px solid rgba(42, 170, 184, 0.85);
    outline-offset: 3px;
  }

  .ltf-site-nav.is-nav-open .ltf-nav-toggle .ltf-nav-toggle-bar:nth-of-type(1) {
    transform: translateY(7px) rotate(45deg);
  }

  .ltf-site-nav.is-nav-open .ltf-nav-toggle .ltf-nav-toggle-bar:nth-of-type(2) {

    transform: scaleX(0);
  }

  .ltf-site-nav.is-nav-open .ltf-nav-toggle .ltf-nav-toggle-bar:nth-of-type(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  .ltf-nav-toggle-bar {
    transition: transform 0.25s ease, opacity 0.2s ease;
    width: 22px;
    height: 2px;
    background-color: #FFFFFF;
    border-radius: 1px;
    flex-shrink: 0;
  }

  .ltf-nav-inner > .ltf-nav-toggle.w-button {

    background-color: transparent !important;
    background-image: none !important;

  body.ltf-nav-open {
    overflow: hidden;

  @media (max-width: 991px) {

      display: grid !important;

      height: 52px !important;

    }

    .ltf-nav-toggle .ltf-nav-toggle-bar {

      height: 2px !important;
      background-color: #FFFFFF !important;
      border-radius: 1px !important;
      opacity: 1 !important;
      visibility: visible !important;
    }

    .ltf-nav-inner > .ltf-nav-toggle {
      display: flex !important;
      visibility: visible !important;
      opacity: 1 !important;
      width: 44px !important;
      height: 44px !important;
      min-width: 44px !important;
      min-height: 44px !important;
    }

    /* Toggle must live OUTSIDE .ltf-nav-mobile-panel */
    .ltf-nav-mobile-panel .ltf-nav-toggle {
      display: none !important;
    }

    .ltf-nav-toggle {

    }

    .ltf-nav-toggle .ltf-nav-toggle-bar {

    /*

      align-items: center !important;
      justify-content: center !important;
      position: absolute !important;
      left: 50% !important;
      top: 0 !important;
      bottom: 0 !important;
      transform: translateX(-50%) !important;

      height: 52px !important;
      max-height: 52px !important;
      margin: 0 !important;
      padding: 0 !important;
      line-height: 0 !important;

      grid-row: auto;
      pointer-events: auto;

    .ltf-nav-logo-link .ltf-nav-logo,
    .ltf-nav-logo-link img,
    .ltf-nav-logo {

      width: auto !important;
      max-width: 56.25vw;
      max-height: 21px !important;
      object-fit: contain;
      margin: 0 !important;
      vertical-align: middle;
    }

    .ltf-hero .hero-canvas-wrapper {
      overflow: hidden;
    }

    /* Nav is fixed 52px; hero pulls up with margin-top:-52px. Plain 100svh
       therefore ends ~52px ABOVE the screen bottom (shirt “floating”).
       Add the nav height back so the section bottom = viewport bottom.
       Prefer svh (stable) over dvh (Safari chrome resize / bottom-bar jump). */
    .ltf-hero {
      height: calc(100vh + 52px) !important;
      min-height: calc(100vh + 52px) !important;
      max-height: none !important;
      height: calc(100svh + 52px) !important;
      min-height: calc(100svh + 52px) !important;
    }

    .ltf-hero > .ltf-site-cage,
    .ltf-hero #canvas3d {
      height: 100% !important;
      max-height: 100% !important;
    }

    /* Lock canvas to section scroll; top flush under 52px nav (hero has
       margin-top:-52px, so top:52px lands at the nav bottom edge).
       Use inset shorthand — do NOT set inset:auto after top/left/etc
       (that resets all sides and collapses the wrapper to 0 height). */
    .ltf-hero .hero-canvas-wrapper {
      position: absolute !important;
      inset: 52px 0 0 0 !important;
      width: 100% !important;
      height: auto !important;
      max-height: none !important;
      transform: none !important;
      will-change: auto !important;
    }

    .ltf-hero #canvas3d {
      position: absolute !important;
      inset: 0 !important;
      transform: none !important;
      will-change: auto !important;
    }

    /* Kill desktop 2-col combo that was cascading onto mobile */
    .ltf-hero-bottom-bar,
    .ltf-hero-bottom-bar.ltf-split-2 {
      position: absolute !important;
      display: grid !important;
      grid-template-columns: minmax(0, 1fr) !important;
      grid-template-rows: auto !important;
      justify-items: center !important;
      align-items: center !important;
      gap: 18px !important;
      left: 25px !important;
      right: 25px !important;
      bottom: 103px !important; /* restored — 123 + button gap shoved copy into nav */
      width: auto !important;
      max-width: none !important;
      min-width: 0 !important;
      transform: none !important;
      translate: none !important;
      will-change: auto !important;
      text-align: center !important;
    }

    /* Hero body stack: full width inset; bar center, body left, CTA center */
    .ltf-hero-bottom-bar .is-hero-copy,
    .ltf-hero-bottom-bar .ltf-stack,
    .ltf-hero-bottom-bar .ltf-stack.ltf-split-copy,
    .ltf-hero-bottom-bar .ltf-stack.ltf-split-copy.is-hero-copy {
      width: 100% !important;
      max-width: none !important;
      min-width: 0 !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
      box-sizing: border-box !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-self: stretch !important;
    }

    .ltf-hero-bottom-bar .ltf-body-text {
      width: 100% !important;
      max-width: none !important;
      text-align: left !important;
      align-self: stretch !important;
      font-size: 20px !important;

      padding: 0 !important;
      padding-right: 20% !important;
      border: 0 !important;
      border-radius: 0 !important;
      background: transparent !important;
      box-shadow: none !important;

    /*

    */

    .ltf-hero > .ltf-site-cage {
      overflow: visible !important;
    }

    .ltf-hero .hero-canvas-wrapper,
    .ltf-hero #canvas3d {
      overflow: hidden !important;
    }

    .ltf-hero-figure {
      bottom: -40px !important;
      right: -50px !important;
      width: min(92vw, 420px) !important;
    }

    .ltf-hero-headline {
      top: calc(12% + 55px) !important; /* +25px down from prior */

      padding-right: 25px !important;
      box-sizing: border-box !important;
      width: 100% !important;
      max-width: 100% !important;
    }

    /* Perfect size −5% so 25px pad keeps “WORLD” on two lines */
    .ltf-hero .ltf-main-header {
      font-size: clamp(3.078rem, 14.25vw, 3.99rem) !important;
      max-width: 100% !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
      box-sizing: border-box !important;
      overflow-wrap: normal;
      word-break: normal;
    }

    .ltf-main-header {
      padding-left: 0;
      padding-right: 0;
    }

    /*
      Expanded panel: half the previous vertical padding + medium slide.

      display: flex !important;

      top: 52px;

      right: 0;

      align-items: stretch;
      justify-content: flex-start;
      gap: 0;
      width: 100%;
      height: auto;
      max-height: min(80vh, 640px);

      padding: 14px clamp(20px, 5vw, 32px) 16px;

        transform 0.4s ease,

  /* ════════════════════════════════════════════════════════════════════

  /* Beyond the Gear list position lives in Designer (.ltf-upsell-list.ltf-split-asset). */

  /* Force SPECs & / STANDARDS onto two lines. */
  .ltf-split-copy .ltf-section-header-navy {
    max-width: 6.4em;

  @keyframes ltf-upsell-sweep {

  /* Sweep clips to the 12px rounded list border. */

  .ltf-upsell-list.ltf-split-asset {

    width: 100%;
    padding: 0;

    display: flex;
    align-items: flex-start;

    position: relative;
    z-index: 2;
  }

  .ltf-upsell-list-item::before {
    content: '▪';
    color: #2AAAB8;
    font-size: 11px;
    line-height: 1.7;
