<!--
  CLEAN SLATE — Mobile layout fixes (append to Page Head custom code)

  Hero shirt + CTA position/size: Webflow Designer ONLY — no locks here.
  Keeps stable hero shell height, overflow, canvas clip, and funnel gutters.
-->
<style id="ltf-mobile-fixes">
@media (max-width: 991px) {
  .ltf-hero {
    height: calc(100svh + 52px) !important;
    min-height: calc(100svh + 52px) !important;
    max-height: none !important;
    /* overflow-x:clip + overflow-y:visible computes to clip both axes — use visible */
    overflow: visible !important;
  }

  .ltf-hero > .ltf-site-cage.ltf-cage {
    height: 100% !important;
    min-height: 100% !important;
    overflow: visible !important;
  }

  .ltf-hero .hero-canvas-wrapper,
  .ltf-hero #canvas3d {
    overflow: hidden !important;
  }

  /* Webflow sets max-height:78% + hero overflow:hidden — clips shirt at fold */
  .ltf-hero-figure {
    max-height: none !important;
  }

  /*
    Webflow anchors CTA with position:absolute + bottom — ties it to hero box
    height (100vh/svh), so it drifts when the mobile URL bar resizes on scroll.
    Flow layout keeps CTA in the copy stack; Designer still controls spacing.
  */
  .ltf-btn-gradient-wrap.is-hero-cta-wrap {
    position: relative !important;
    top: auto !important;
    bottom: auto !important;
    left: auto !important;
    right: auto !important;
    transform: none !important;
  }

  .ltf-funnel-cta {
    box-sizing: border-box !important;
    height: auto !important;
    min-height: 0 !important;
    overflow: visible !important;
  }

  .ltf-funnel-cta-inner {
    box-sizing: border-box !important;
    width: 100% !important;
    max-width: 100% !important;
  }

  .ltf-funnel-cta-heading {
    padding-left: 0 !important;
    padding-right: 0 !important;
  }
}
</style>
